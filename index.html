<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>宣和进士·第一卷 释褐</title>
<style>
:root{
  --paper:#f3ead6; --paper2:#faf4e4; --ink:#2e2a22; --ink2:#5c5443;
  --line:#b9a985; --accent:#8c3b2e; --accent2:#4a6b5d; --gold:#a8843e;
  --warn:#9a2f26; --shadow:rgba(60,48,30,.18);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:"Songti SC","Noto Serif SC","Source Han Serif SC",STSong,SimSun,serif;
  background:#d9cdb2;
  background-image:radial-gradient(circle at 20% 10%,#e6dcc4 0,transparent 45%),radial-gradient(circle at 85% 80%,#e9dfc8 0,transparent 50%);
  color:var(--ink); min-height:100vh; padding:16px; line-height:1.6;
}
.wrap{max-width:1280px;margin:0 auto;display:grid;grid-template-columns:250px 1fr 260px;gap:14px;align-items:start}
.panel{background:var(--paper);border:1px solid var(--line);box-shadow:2px 3px 0 var(--shadow);padding:14px;position:relative}
.panel::before{content:"";position:absolute;inset:4px;border:1px solid rgba(185,169,133,.45);pointer-events:none}
.panel h2{font-size:19px;letter-spacing:3px;color:var(--accent);border-bottom:1px solid var(--line);padding-bottom:6px;margin-bottom:10px;font-weight:600}

/* 顶栏 */
.top{grid-column:1/-1;background:var(--paper2);border:1px solid var(--line);box-shadow:2px 3px 0 var(--shadow);padding:10px 18px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
.top .title{font-size:26px;letter-spacing:6px;color:var(--accent);font-weight:700}
.top .sub{font-size:14px;color:var(--ink2);letter-spacing:2px}
.top .date{font-size:18px;color:var(--ink);letter-spacing:2px}
.top .date b{color:var(--accent);font-size:22px}
.top .btns{display:flex;gap:8px}
button{font-family:inherit;cursor:pointer}
.tbtn{background:var(--paper);border:1px solid var(--line);color:var(--ink2);padding:5px 12px;font-size:16px;letter-spacing:1px}
.tbtn:hover{border-color:var(--accent);color:var(--accent)}
.tbtn:disabled{opacity:.4;cursor:not-allowed}

/* 人物立绘 */
.portrait{width:100%;height:250px;background:#e4d5b4;border:1px solid var(--line);display:block;object-fit:cover;object-position:center 12%}
.pname{text-align:center;font-size:22px;letter-spacing:3px;margin:8px 0 2px}
.pmeta{text-align:center;font-size:13px;color:var(--ink2);letter-spacing:1px}
.label{font-size:13px;color:var(--ink2);letter-spacing:1px;margin:12px 0 4px;border-left:3px solid var(--accent);padding-left:6px}

/* 数值 */
.row{display:flex;align-items:center;gap:6px;font-size:14px;margin:5px 0}
.row .nm{width:34px;flex:none;color:var(--ink)}
.row .bar{flex:1;height:8px;background:#ddd0b2;border:1px solid var(--line);position:relative;overflow:hidden}
.row .fill{height:100%;background:var(--accent2);transition:width .35s}
.row .fill.low{background:var(--warn)}
.row .vl{width:28px;text-align:right;font-weight:700;color:var(--ink)}
.res-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.res{background:rgba(255,255,255,.35);border:1px solid var(--line);padding:5px 7px;font-size:14px}
.res b{display:block;font-size:18px;color:var(--accent);margin-top:2px}
.res-tip{position:relative;z-index:20;cursor:help}
.res-tip:hover,.res-tip:focus{border-color:var(--gold);outline:none}
.res-tip .tip{display:none;position:absolute;left:calc(100% + 6px);top:-2px;width:238px;background:var(--paper2);border:1px solid var(--gold);box-shadow:3px 4px 0 var(--shadow);padding:8px 10px;font-size:13px;line-height:1.6;text-align:left;color:var(--ink);z-index:60}
.res-tip:hover .tip,.res-tip:focus .tip{display:block}
.res-tip .tip em{display:block;font-style:normal;font-weight:700;color:var(--accent);letter-spacing:1px;border-bottom:1px dotted var(--line);padding-bottom:4px;margin-bottom:4px}
.res-tip .tip>span{display:block}
.res-tip .tip b{display:inline;font-size:13px;color:var(--accent);margin-top:0}
.res-tip .tip .tip-net{border-top:1px dotted var(--line);margin-top:4px;padding-top:4px}
.res-tip .tip small{display:block;font-size:12px;color:var(--ink2);border-top:1px dotted var(--line);margin-top:5px;padding-top:5px}
.talent{display:flex;justify-content:space-between;font-size:14px;padding:3px 0;border-bottom:1px dotted var(--line)}

/* 主区 */
.main{min-height:640px;display:flex;flex-direction:column}
.turnbar{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:12px;font-size:16px;color:var(--ink2)}
.ap{color:var(--accent);font-weight:700}
.dossier{background:var(--paper2);border:1px solid var(--line);padding:18px 20px;flex:1;position:relative}
.dossier::after{content:"卷";position:absolute;right:10px;top:6px;font-size:60px;color:rgba(140,59,46,.06);font-weight:700}
.ev-cat{display:inline-block;font-size:13px;letter-spacing:2px;color:var(--gold);border:1px solid var(--gold);padding:1px 8px;margin-bottom:8px}
.ev-title{font-size:26px;letter-spacing:3px;color:var(--ink);margin-bottom:6px}
.ev-meta{font-size:14px;color:var(--ink2);border-bottom:1px dashed var(--line);padding-bottom:8px;margin-bottom:14px;letter-spacing:1px}
.ev-text{font-size:18px;line-height:2.1;text-indent:2em;color:#3b352a;min-height:150px;letter-spacing:.5px}
.ev-text::first-letter{color:var(--accent);font-size:22px}
.choices{margin-top:18px;border-top:1px solid var(--line);padding-top:12px}
.choices .hint{font-size:14px;color:var(--ink2);margin-bottom:8px;letter-spacing:1px}
.choice{display:block;width:100%;text-align:left;background:rgba(255,255,255,.35);border:1px solid var(--line);padding:10px 12px;margin:7px 0;font-size:17px;color:var(--ink);transition:.15s;position:relative}
.choice:hover:not(:disabled){background:#fff8e6;border-color:var(--accent);transform:translateX(3px)}
.choice:disabled{opacity:.45;cursor:not-allowed;text-decoration:line-through}
.choice .k{display:inline-block;background:var(--accent);color:#fff8e6;width:20px;height:20px;line-height:20px;text-align:center;margin-right:8px;font-size:14px}
.choice .eff{display:block;font-size:13px;color:var(--ink2);margin:4px 0 0 28px;letter-spacing:.5px}
.choice .cond{color:var(--gold)}
.nav{display:flex;justify-content:flex-end;gap:10px;margin-top:14px}
.big{background:var(--accent);color:#fff8e6;border:1px solid var(--accent);padding:8px 22px;font-size:17px;letter-spacing:3px}
.big:hover{background:#a8493a}
.big.ghost{background:transparent;color:var(--accent)}

/* 右栏事件列表 */
.evlist{list-style:none;font-size:14px}
.evlist li{border-bottom:1px dotted var(--line);padding:6px 4px;display:flex;justify-content:space-between;gap:6px;align-items:center}
.evlist li span{color:var(--ink2)}
.evlist li b{font-weight:600;color:var(--ink)}
.tag{font-size:12px;padding:1px 5px;border:1px solid var(--line);color:var(--ink2);white-space:nowrap}
.tag.fix{border-color:var(--accent);color:var(--accent)}
.tag.free{border-color:var(--accent2);color:var(--accent2)}
.tag.cond{border-color:var(--gold);color:var(--gold)}
.doit{background:var(--paper2);border:1px solid var(--line);font-size:13px;padding:2px 6px;color:var(--accent);white-space:nowrap}
.doit:hover{border-color:var(--accent);background:#fff8e6}
.log{font-size:13px;color:var(--ink2);max-height:150px;overflow:auto;line-height:1.8}
.log div{border-bottom:1px dotted rgba(185,169,133,.5);padding:1px 0}

/* 弹窗 */
.mask{position:fixed;inset:0;background:rgba(40,32,20,.5);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
.mask.on{display:flex}
.modal{background:var(--paper2);border:1px solid var(--line);box-shadow:4px 6px 0 rgba(0,0,0,.25);max-width:640px;width:100%;max-height:85vh;overflow:auto;padding:22px 26px;position:relative}
.modal h3{font-size:24px;letter-spacing:4px;color:var(--accent);border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:14px}
.modal .close{position:absolute;right:14px;top:12px;background:none;border:none;font-size:24px;color:var(--ink2)}
.modal table{width:100%;border-collapse:collapse;font-size:16px}
.modal td,.modal th{border:1px solid var(--line);padding:5px 8px;text-align:left}
.modal th{background:rgba(140,59,46,.08);color:var(--accent)}
.endtitle{font-size:34px;letter-spacing:8px;color:var(--accent);text-align:center;margin:10px 0}
.endtext{text-align:center;font-size:18px;line-height:2;margin:16px 0}
.ev-hint{text-align:center;font-size:14px;color:var(--gold);letter-spacing:1px;margin:14px 0 4px}
.dossier.clickable{cursor:pointer}
.dossier.clickable:hover{border-color:var(--accent)}
.epilogue{margin-top:18px;border-top:1px solid var(--line);padding-top:12px}
.epilogue h4{font-size:16px;letter-spacing:3px;color:var(--gold);margin-bottom:8px;text-align:center}
.epilogue p{font-size:15px;line-height:1.95;text-indent:2em;margin:6px 0;color:#3b352a}
.gallery details{border:1px solid var(--line);background:rgba(255,255,255,.3);margin:8px 0;padding:8px 12px}
.gallery summary{cursor:pointer;font-size:17px;color:var(--accent);letter-spacing:1px}
.gallery .gmeta{font-size:13px;color:var(--ink2);margin:6px 0}
.gbody{font-size:17px;line-height:2;text-indent:2em;text-align:left;margin:8px 0}
.gallery .gbody{font-size:15px;line-height:1.9}
.gallery .gepi p{font-size:14px;line-height:1.9;text-indent:2em;margin:5px 0}
.unlocked{color:var(--accent2);font-size:13px}
.gallery .locked{border:1px dashed var(--line);background:rgba(255,255,255,.18);margin:8px 0;padding:8px 12px;font-size:15px;color:var(--ink2);letter-spacing:1px}
.footer{grid-column:1/-1;text-align:center;font-size:13px;color:var(--ink2);letter-spacing:2px;padding:6px}
@media(max-width:1000px){.wrap{grid-template-columns:1fr}.top{grid-column:1}.footer{grid-column:1}.portrait{height:200px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div><div class="title">宣和进士</div><div class="sub">第一卷 · 释褐 ｜ 两浙路 · 某县主簿</div></div>
    <div class="date" id="dateBox"></div>
    <div class="btns">
      <button class="tbtn" id="btnDossier">档案</button>
      <button class="tbtn" id="btnBag">行囊</button>
      <button class="tbtn" id="btnHelp">规则</button>
      <button class="tbtn" id="btnSave">存档</button>
      <button class="tbtn" id="btnLoad">读档</button>
      <button class="tbtn" id="btnRestart">重开</button>
      <button class="tbtn" id="btnEndings">结局图鉴</button>
    </div>
  </div>

  <div class="panel">
    <div id="portraitBox"></div>
    <div class="pname">李皋 <span style="font-size:16px">字尧臣</span></div>
    <div class="pmeta">两浙路越州人</div>
    <div class="label">六维 · 清零即终局</div>
    <div id="sixBox"></div>
    <div class="label">天赋 · 自我研讨可成长</div>
    <div id="talentBox"></div>
    <div class="label">独立资源</div>
    <div class="res-grid" id="resBox"></div>
  </div>

  <div class="panel main">
    <div class="turnbar"><div id="turnInfo"></div><div class="ap" id="apInfo"></div></div>
    <div class="dossier" id="dossier"></div>
    <div class="nav" id="nav"></div>
  </div>

  <div class="panel">
    <h2>事件簿</h2>
    <div class="label" style="margin-top:0">本月待办（强制）</div>
    <ul class="evlist" id="pendingList"></ul>
    <div class="label">可自选（每月每类至多一次）</div>
    <ul class="evlist" id="availList"></ul>
    <div class="label">履历</div>
    <div class="log" id="logBox"></div>
  </div>

  <div class="footer">宣和进士·靖康浮沉录·第一卷·释褐</div>
</div>

<div class="mask" id="mask"><div class="modal" id="modal"></div></div>

const EVENTS={
'EH-0117-01':E('EH-0117-01','释褐赴任·两浙路','固定','政和七年春·第1月｜汴京吏部→两浙路任所','新科及第，吏部注拟。榜下唱名，你被授两浙路某县主簿。同榜有人得京职，有人赴边陲，而你收拾行囊，南下赴任——两浙富庶，却是应奉局苛政如虎之地。此行无选择可择，十年根基，自踏上这条路时便已落定。',[{k:'A',label:'整装南下，赴任两浙路',eff:'',note:'开场事件，无数值变化'}]),

'EH-0117-02':E('EH-0117-02','赴任接印·县衙积弊','固定','第1月·接印后｜任所县衙','前任升迁而去，留下一堆烂账：簿册颠倒，赋役不均，狱中在押二十余人多未结案。胥吏们斜眼打量这位新来的进士，等着看你第一把火烧向何处。',[
  {k:'A',label:'雷霆整顿，先拿胥吏开刀',eff:'清议+6 民心+5 宦官−4',flag:'接印A'},
  {k:'B',label:'宽缓三月，徐徐图之',eff:'民心+3 宦官+4 清议−4 朝望+2'},
  {k:'C',label:'上书自陈，乞朝廷派员清账',eff:'圣眷−5 朝望+6 清议+4'}
]),

'EH-0117-03':E('EH-0117-03','士绅拜码头','固定','到任后第2月｜县衙／士绅宅','本地士绅联名投帖，邀你赴宴。帖上皆是隐田千顷、纳粟得官之辈。宴席是假，试探你对豪右的态度是真——你若低头，往后办事顺畅；你若倨傲，这县的粮与税便难收了。',[
  {k:'A',label:'赴宴，礼数周全',eff:'宦官+5 清议−5 民心−4'},
  {k:'B',label:'婉拒，礼尚往来',eff:'清议+5 民心+3'},
  {k:'C',label:'当众申明不与豪右同流',eff:'清议+10 民心+6 朝望−3'}
],'gentry'),

'EH-0117-04':E('EH-0117-04','盘点县库·钱粮亏空','固定','到任后第3月｜县衙库房','库银账实不符，亏空三千贯。前任已高升，账房先生与主簿互相推诿，都说「历年如此」。这笔窟窿若不填，年终上供便过不了转运使司的关。',[
  {k:'A',label:'追缴胥吏，勒令填补',eff:'宦官+10 民心−5 清议+3'},
  {k:'B',label:'自掏俸禄弥补缺口',eff:'宦官+6 清议+6 民心+3'},
  {k:'C',label:'隐瞒不报，挪东补西',eff:'宦官−2 圣眷+2 清议−4',zj:0}
],'clerk'),

'EH-0117-08':E('EH-0117-08','花石纲预征·应奉局来人','固定','每年4月固定触发｜县衙／乡野','应奉局差役持符而至，指名索奇花异石，限日办差。差役放出话来：官家要修艮岳，谁误了花石纲，谁就别想考满。而乡间为此已拆墙毁田、夫役逃亡。',[
  {k:'A',label:'如数应办，加紧催征',eff:'圣眷+10 宦官−8 民心−12 清议−6',zj:0},
  {k:'B',label:'拖延应付，暗中减办',eff:'民心+5 圣眷−6 宦官−2'},
  {k:'C',label:'上书陈情，乞免本县',eff:'清议+10 民心+8 圣眷−10 朝望+4'}
],'eunuch'),

'EH-0117-12':E('EH-0117-12','秩满磨勘·去留抉择','固定','宣和元年冬·第36月｜县衙','三年秩满，磨勘转官。吏部行文至县，然能否更进一步，全凭这三年攒下的本钱：圣眷、宦官、文辞、朝望，缺一不可。也有那无甚功劳、无甚过错的，循例转官；更有看透世事者，自请辞官归去。你站在县衙阶前，逐一核对自己够得上哪一条。',[
  {k:'A',label:'圣眷在握',cond:'圣眷 ≥ 90',condFn:s=>s.six['圣眷']>=90,out:'升官，赴京东西路任职；第二卷开启'},

  {k:'E',label:'朝中有人',cond:'朝望 ≥ 80',condFn:s=>s.six['朝望']>=80,out:'升官，赴京东西路任职；第二卷开启'},
  {k:'F',label:'自请辞官',cond:'上述 A—E 条件均不满足',condFn:s=>![s.six['圣眷']>=90,(s.six['宦官']>=90&&s.six['圣眷']>=80),(s.talents['文辞']>=75&&s.six['圣眷']>=80),(s.res['政绩']>=2000),(s.six['朝望']>=80)].some(Boolean),out:'辞官归里，游戏结束',end:'retire'}

'FREE-00':E('FREE-00','自我研讨','自由','任意月·常驻｜耗1行动点','案牍稍闲，你独坐书斋。近年来亲历的每桩事都在此刻翻涌——钱粮如何调度、刁民如何驯服、文章如何取重当世、这副身子还撑不撑得住下一个冬天。你决定趁此空隙，补一补自己的功课。',[
  {k:'A',label:'研讨理政，精研钱谷刑名',eff:'理政+2'},
  {k:'B',label:'研讨武略，讲习兵法战阵',eff:'武略+2'},
  {k:'C',label:'研讨文辞，揣摩文章翰墨',eff:'文辞+2'},
  {k:'D',label:'研讨摄生，调养气血精神',eff:'健康+2'}
]),

'FREE-01':E('FREE-01','劝课农桑','自由','任意月·常驻｜耗1行动点','春耕将起，你亲赴乡野，劝百姓垦荒、修渠、备耕。告示贴遍四乡，又召里正询问水利。一年之计在于春，田里多一分耕耘，府库便多一分底气。',[
  {k:'A',label:'劝课农桑，鼓励垦荒',eff:'农民+100 流民−100 政绩+100'}
]),

'FREE-02':E('FREE-02','卸甲归田','自由','任意月·常驻｜耗1行动点','境内稍安，你认为养兵耗饷，不如让部分厢军解甲归农，回归田亩。军中有人怨怼，也有人欣然领了牛种而去。裁撤容易，一旦有事，再募就难了。',[
  {k:'A',label:'裁军归农',eff:'兵备−50 农民+50'}
]),

'FREE-03':E('FREE-03','征辟厢军','自由','任意月·常驻｜耗1行动点','境内盗匪渐起，厢军额缺。你张榜募兵，将无力自存的农户编入厢军，给粮给械，教以战阵。应募者脱了农籍、换了军装，田里少一名耕者，城头多一名守卒。你掂量着这笔账。',[
  {k:'A',label:'征辟厢军，募农为兵',eff:'兵备+100 农民−100'}
]),

'EH-0117-06':E('EH-0117-06','胥吏舞弊案','条件','政和七年冬｜县衙｜接印选A触发','你查获主簿与胥吏勾结，伪造税票、中饱私囊，赃银累计数百贯。主簿是转运使司某官的姻亲，处置轻重，你在这一案上第一次尝到「官官相护」的分量。',[
  {k:'A',label:'依法严办，依律论罪',eff:'清议+8 民心+6 宦官+5'},
  {k:'B',label:'革职了事，追回赃银',eff:'宦官+6 清议+3 民心+2'},
  {k:'C',label:'留用其才，暗中控制',eff:'宦官+8 清议−5 民心−4'}
],'clerk',s=>!!s.flags['接印A']),

'EH-0117-09':E('EH-0117-09','兴修水利·河堤工程','固定','第一年六月（第6月）｜河堤工地｜固定发生','境内河堤年久失修，乡老聚于衙前，说汛期一到，两岸田庐皆成鱼鳖。修堤要钱要人，而库里的银子，每一贯都有别的去处等着。',[
  {k:'A',label:'动用库银，大修河堤',eff:'宦官−12 民心+10 军心+3 清议+5'},
  {k:'B',label:'征发民夫，以工代赈',eff:'民心+5 宦官−5'},
  {k:'C',label:'上报朝廷，请求拨款',eff:'圣眷−3 朝望+5 宦官+2 民心−3'}
],'main'),

'EH-0117-11':E('EH-0117-11','岁暮赈济·常平仓','固定','每年十二月｜常平仓／粥棚｜固定发生','岁歉民饥，常平仓存粮有限，四乡流民渐聚于城下。幕僚献策：或开仓放粮，或劝富户捐输，或趁荒年募兵收流民为厢军——三条路，三种未来。',[
  {k:'A',label:'开仓放粮，设粥棚',eff:'民心+12 宦官−12 圣眷+2 清议+6'},
  {k:'B',label:'劝富户捐粮，官为民先',eff:'民心+7 宦官−4 清议+4'},
  {k:'C',label:'收流民为厢军（荒年募兵）',eff:'军心+10 宦官−8 民心+4 兵备+100'}
],'gentry'),

'COND-01':E('COND-01','贿赂宦官','条件','私库≥500｜耗1行动点','宫中近侍悄悄递话：宦官要有「表示」，圣眷才能长久。你掂量私库里的银子——这笔钱送出去，换来的是宫禁奥援与天子青眼；不送，则前路的关节无人打点。',[
  {k:'A',label:'奉上重礼，打通关节',cond:'私库 ≥ 500',condFn:s=>s.res['私库']>=500,eff:'私库−200 宦官+12 圣眷+6'}
],'eunuch',s=>s.res['私库']>=500),

'FIX-01':E('FIX-01','厢军暴动','固定','府库=0｜占1行动点','库银见底，欠饷已逾三月。厢军哗于校场，旗纛倒竖，为首者执刀立于衙前：「知县老爷，粮饷何在？」城门已被把住，市井开始逃散。',[
  {k:'A',label:'晓谕大户纳粮',eff:'宦官−10 军心+8 民心−12 府库+2000'},
  {k:'B',label:'出私库纳粮',eff:'军心+6 清议+4 民心+3 私库−500 府库+500'},
  {k:'C',label:'请上级借饷，暂度危机',eff:'朝望−5 圣眷−6 军心+4 府库+500'},
  {k:'D',label:'斩杀闹事头领',eff:'圣眷+5 清议−4 军心−8 民心−5 兵备−50'}
],'clerk'),

'FIX-02':E('FIX-02','贼寇略城','概率','15%概率｜命中即为固定事件｜兵备判定','探马急报：一股流寇夜袭县城，已破外郭，直扑县衙。你登上城楼——墙头空无一人，兵器库早已见底。若此时城中有兵，尚可一战；若兵备早已归零，则此城已无守御之力。',[
  {k:'A',label:'沉稳应战',cond:'兵备≥300 且 军心≥60',condFn:s=>s.res['兵备']>=300&&s.six['军心']>=60,eff:'军心+10 民心+8 圣眷+8 兵备−50',out:'守城成功'},
  {k:'B',label:'临时募兵',cond:'0<兵备<300',condFn:s=>s.res['兵备']>0&&s.res['兵备']<300,eff:'民心−8 军心+5 圣眷+5 兵备−50',out:'守城成功'},
  {k:'C',label:'无兵可守，城破',cond:'兵备=0',condFn:s=>s.res['兵备']===0,eff:'',out:'直接游戏结束',end:'cityfall'}
],'main'),

'EH-0117-07':E('EH-0117-07','争田案·法理人情','概率','任意月｜概率20%｜县衙公堂','豪强占民田三百亩，原告持前朝旧契，被告有士绅撑腰，双方供词互驳。堂下观者云集——这一判，百姓看的是你有没有胆，士绅看的是你识不识趣。',[
  {k:'A',label:'依法判还民田',eff:'民心+10 清议+6 宦官−3'},
  {k:'B',label:'折中调解，各让一步',eff:'民心−2 清议−4 宦官+6'},
  {k:'C',label:'偏袒豪强，换取捐输',eff:'宦官+10 民心−9 清议−6'}
],'gentry'),

'EH-0117-10':E('EH-0117-10','上官考察·转运使巡县','概率','十一月至次年正月｜概率50%｜县衙／驿馆','转运使司考核属县，你的政绩将定明年去留。幕僚递上一份「说项清单」：某公爱古董，某公喜金银。是据实呈报，还是打点关节？',[
  {k:'A',label:'如实呈报，不假修饰',eff:'清议+6 朝望+3 圣眷−2 民心+3'},
  {k:'B',label:'送礼打点，求其美言',eff:'朝望+8 宦官−8 清议−5'},
  {k:'C',label:'虚报政绩，夸大垦田',eff:'圣眷+6 朝望+5 民心−4'}
],'governor')
};

/* ============ 游戏状态 ============ */
/* 九张结局卡：正文与卷末语均出自《第一卷结局卡》文档 */
const ENDINGS = {
  "e01": {
    "id": "e01",
    "num": 1,
    "name": "民变四起",
    "meta": "类别：六维清零 ｜ 触发：民心 = 0（可由苛政抉择直接压低，或由流民 ≥ 2000 每月民心 −2 长期累积清零）｜ 判定优先级：高于一切剧情分支",
    "body": [
      "流民啸聚，火把连成一条赤色的长龙，把县衙的匾额照得通明。你听见城门被撞开的声音，也听见有人喊你的名字——那声调门，三年前还曾是叩头称谢的语声。你弃印而走，或死于乱民之手。案头那卷「民风淳谨」的旧册，被火舌一卷，化作黑蝶。"
    ],
    "epilogue": [
      "宣和年间的天下，看似锦绣，实已蛀空。艮岳的奇石从太湖络绎北上，挽舟的丁夫倒毙于途，尸骨弃在汴水两岸；青溪的山谷里，聚众者以诛除权佞为号，一呼而千百人响应。这些都不是一县一邑之事，而是整个朝廷的挥霍与失政，在百年承平的皮囊下积成的脓疮。你只是一个被外放到此的七品县令，手中不过百里之地、数万之民，在这台巨大的帝国机器里，你是最末梢的一枚齿轮。",
      "你以为乱民是被你逼反的。其实他们要反的，是汴京城里的艮岳，是应奉局的旗帜，是那些从未到过这里、却年年向这里索取的人。你的严苛不过是压在上面的最后一只手，而那只手，也是被上官的考绩、朝廷的催逼、军饷的亏空一步步推到这里的。你既是加害者，也是被驱使的人。把一场席卷东南的民变算在一个县令头上，是高估了你，也是高估了这朝廷尚能问责的诚意。",
      "火烧起来的时候，你站在县衙的阶上，看见火把连成长龙，映红了半边天。那光亮里没有你的名字，他们喊的是权臣的姓名，是天子的过失，是这世道的不公。你忽然明白，自己从来不是这场戏的主角，只是一个恰好站在台前、被推到灯下的人。你有你的算计、你的苦衷、你不得不为的理由，可在时代的怒火面前，这些都轻得像灰。",
      "史臣曰：民为邦本，本固邦宁。然本之朽，非一日之寒；其溃也，亦非一令之责。以一县之令而任天下之怨，是朝廷卸责之巧，非史笔持平之论。李皋之死，死于其时，非独死于其政。大厦将倾，一木何支？后之览者，当哀其身世之微，而无所归咎于一人也。"
    ]
  },
  "e02": {
    "id": "e02",
    "num": 2,
    "name": "名裂身败",
    "meta": "类别：六维清零 ｜ 触发：清议 = 0 ｜ 判定优先级：高于一切剧情分支",
    "body": [
      "邸报尚未送到县衙，弹章已先到了汴京。台谏官风闻奏事，连上七疏，字字如刀：贪墨、苛政、附权、欺君。诏下，革职除名，押解回籍。沿途士林围观，指指点点，有人往你的车驾上掷烂果。你忽然想起初到任时，太学生陈东曾把你引为同道——那封信，如今成了讽刺。"
    ],
    "epilogue": [
      "大宋士人最重名节，而这名节的裁判不在庙堂，在士林；不在刀兵，在口舌。台谏可以风闻奏事，不必有实据；太学生可以伏阙上书，一动便惊动圣听。宣和年间，蔡京当国，党籍屡起屡仆，今日之清流，明日便可能成了朋党。一个人的是非贤愚，往往不由其行事，而由他所站的那一方、所结的那一党来定。你初入仕途时看轻了这股力量，以为只要上官满意、案牍清白，便足以自立。",
      "可士林的眼睛一直盯着你。你怎样断一桩案、怎样应一次差、怎样对待投书求见的落魄书生，都被人记进一本看不见的簿册。那簿册不记你的苦衷，只记你的立场。你想两头周全，结果两头都不认你：依附权贵者说你沽名，亲近清流者说你趋利。你想以治绩自明，可在这座朝廷里，治绩从来不是一个人能否立身的凭据，站队才是。",
      "弹章到达的那一日，你正在整理三年积下的案卷。纸是白的，字是黑的，件件都经你亲手签押。可这些白纸黑字，到头来没有一件替你说得上话。解下印绶走出衙门时，街边有书生认出你，低声说：这就是那个被人称作佞臣的官。你想辩白，却发现没有人在听——士林早已替你写好了结论，其余的一切都只是注脚。",
      "史臣曰：名者，身之符也；符毁则身辱。然宋世之士论，其权常操于党争之手，是非未必尽公，毁誉未必尽实。以一介县令而撄天下之口，犹以一叶障东流之水。李皋之名，或非真有玷，特不幸而当其冲耳。观此可知，乱世之士，身可毁，名亦可夺，所能守者，唯寸心而已。"
    ]
  },
  "e03": {
    "id": "e03",
    "num": 3,
    "name": "君恩断绝",
    "meta": "类别：六维清零 ｜ 触发：圣眷 = 0 ｜ 判定优先级：高于一切剧情分支",
    "body": [
      "御笔朱批落到吏部：",
      "「李某奏对不逊，挟私抗旨，着即贬岭南，限日启程。」你捧着这道诏书，站在县衙的庭院里，久久没有动。三年前你金榜题名，天子亲策，曾以为「致君尧舜」四字伸手可及。三年后你才懂得，君恩是水，可载舟，亦可覆舟——而你已经把它喝干了。"
    ],
    "epilogue": [
      "天子端坐汴京深宫，距你千里。你治理的百里之地，在他眼中不过是舆图上一粒墨点；你三年的勤勉或过失，传到御前，也不过是奏疏里短短数行。可就是这寥寥数行、乃至朱笔一点，便足以定你一生的去就。宋世优待士大夫，人称与君王共治天下，然而共治云者，不过是君恩所及时的体面话。恩之来，你无从求；恩之去，你亦无从挽。",
      "徽宗皇帝好声色、喜祥瑞，他要的是顺从与讨喜，不是犯颜直谏的臣子。你偏偏每次都要站到他的对面。你以为自己在坚守道理，可在那座宫殿里，道理从来不是最重要的东西，是否顺耳才是。你的一次次不合作，单看都有可原之处，积在一起，却成了不识趣、不安分。等到近臣的奏报一封封递进去，你在天子心中，已从可造之材变成了必须处置的麻烦。",
      "贬谪岭南的路上，瘴气渐重。你回头望北，看不见城墙，只看见三年前那个意气风发的自己，站在殿上朗声对策。那时他相信，凭一腔直气便可致君尧舜。如今你才懂，殿上的日光再亮，也照不到岭南的瘴雨；天子的一句话，比山谷里的风还轻，却能把一个人吹到天涯。你的坚持没有错，可对的道理，未必抵得上一个皇帝的喜好。",
      "史臣曰：君恩难恃，恃之者危。以方枘纳圆凿，其不相入也宜矣。虽然，直道非罪，所患者不择其时。人臣之进退，系于君心之一喜一怒，其命也夫！李皋之贬，非有大恶，直以不能曲意逢迎耳。观斯世之待士，可知忠直者之难容；而皇权之下，个人之升沉，真如浮尘之随风也。"
    ]
  },
  "e04": {
    "id": "e04",
    "num": 4,
    "name": "宦官失势",
    "meta": "类别：六维清零 ｜ 触发：宦官 = 0 ｜ 判定优先级：高于一切剧情分支",
    "body": [
      "宫中的援手，说断就断了。先是内帑银两不再拨付，接着应奉局的人不再替你通风报信，最后连例行的荐举名册里，你的名字也被悄悄抹去。你这才惊觉：这三年来替你挡过风波的那些「内廷贵人」，从来不是朋友，只是一笔生意——而你，已经付不起价了。"
    ],
    "epilogue": [

/* 每月固定事件至多两项：剧情／月份固定优先，触发型固定满额则让位次月 */
const FIXED_IDS=Object.values(EVENTS).filter(e=>e.cat==='固定'||e.forced||e.id==='FIX-01').map(e=>e.id);
function fixedCount(){return S.pending.filter(id=>FIXED_IDS.includes(id)).length}
function addFixed(id){
  if(fixedCount()>=2)return false;
  if(!S.pending.includes(id))S.pending.push(id);
  return true;
}
function rollMonth(){
  const m=(S.month-1)%12+1;
  const novToJan=[11,12,1].includes(m);
  S.rolls={eh07:Math.random()<0.2,eh10:novToJan&&Math.random()<0.5,hit:Math.random()<0.15};
  if(S.res['府库']<=0)addFixed('FIX-01');
  if(S.rolls.hit)addFixed('FIX-02');
}

/* ============ 次月结算预估：与 nextMonth 共用同一套算法 ============ */
function fmtDelta(n){return n===0?'±0':(n>0?'+':'−')+Math.abs(n)}
function monthForecast(){
  const income=Math.round((S.res['农民']||0)*0.5);
  const cost=S.res['兵备']||0;
  const net=income-cost;
  const refugees=Math.min(3000,(S.res['流民']||0)+150);
  return {income,cost,net,treasury:(S.res['府库']||0)+net,private:(S.res['私库']||0)+30,refugees,moraleDrop:refugees>=2000};
}
function treasuryTipHTML(){
  const f=monthForecast();
  return `<span class="tip"><em>次月预计收支</em>
    <span>田赋农桑 <b>${fmtDelta(f.income)}</b></span>
    <span>兵备军饷 <b>${fmtDelta(-f.cost)}</b></span>
    <span class="tip-net">府库净变动 <b>${fmtDelta(f.net)}</b></span>
    <span>预计月末 <b>${f.treasury}</b></span>
    <small>另：私库 ${fmtDelta(30)} → ${f.private}；流民 → ${f.refugees}${f.moraleDrop?'，民心 −2':''}。<br>按当前数值推算，未含未处理事件的后续抉择。</small>
  </span>`;
}

/* ============ 渲染 ============ */
function render(){
  document.getElementById('portraitBox').innerHTML=portraitSVG();
  const y=1117+Math.floor((S.month-1)/12), m=(S.month-1)%12+1;
  document.getElementById('dateBox').innerHTML=`<span class="sub">${ERA(y)} · ${SEASON(m)}</span> <b>${MN[m-1]}</b> <span class="sub">｜ 第 ${S.month} 月 / 36</span>`;
  document.getElementById('sixBox').innerHTML=SIXN.map(n=>{
    const v=S.six[n],low=v<=12;
    return `<div class="row"><span class="nm">${n}</span><div class="bar"><div class="fill ${low?'low':''}" style="width:${Math.min(100,Math.max(0,v))}%"></div></div><span class="vl">${v}</span></div>`;
  }).join('');
  document.getElementById('talentBox').innerHTML=TALN.map(n=>`<div class="talent"><span>${n}</span><b>${S.talents[n]}</b></div>`).join('');
  document.getElementById('resBox').innerHTML=RESN.map(n=>n==='府库'
    ? `<div class="res res-tip" tabindex="0">府库<b>${S.res[n]}</b>${treasuryTipHTML()}</div>`
    : `<div class="res">${n}<b>${n==='政绩'?S.res[n]+' / 2000':S.res[n]}</b></div>`).join('');
  document.getElementById('turnInfo').innerHTML=`第 <b>${S.month}</b> 月 · ${ERA(y)}${MN[m-1]} ｜ 待办 ${S.pending.length} 件`;
  document.getElementById('apInfo').innerHTML=`行动点 <b>${S.ap}</b> / 2`;
  renderLists();
  const dos=document.getElementById('dossier');
  dos.className='dossier';dos.onclick=null;
  if(S.over&&currentEnding)renderEnding();
  else if(current)renderEvent(); else renderIdle();
  document.getElementById('logBox').innerHTML=S.log.slice(0,30).map(x=>`<div>· ${x}</div>`).join('')||'<div>（尚无记录）</div>';
}

function renderIdle(){
  const pending=S.pending.length>0;
  document.getElementById('dossier').innerHTML=`
    <div class="ev-cat">${pending?'待 办':'公 余'}</div>
    <div class="ev-title">${pending?'案牍在前':'堂前暂歇'}</div>
    <div class="ev-meta">${pending?'本月尚有强制事件未结，请于右侧事件簿点击「处理」。':'本月强制事件已结，可自选事件或转月。'}</div>
    <div class="ev-text">${pending
      ? '胥吏捧卷立于阶下，候你裁决。一纸一判，皆关百姓生计、朝堂风评。你不可避，亦无从回头。'
      : '案头稍静。你可以处理右侧的自选事件，也可以就此转月，让府库与私库按例结算。'}</div>`;
  document.getElementById('nav').innerHTML=pending?'':
    '<button class="big" id="nextMonth">转月 · 结算</button>';
  const nb=document.getElementById('nextMonth');if(nb)nb.onclick=nextMonth;
}

function tagCls(c,e){if(e&&e.forced&&S.pending.includes(e.id))return 'fix';return c==='固定'?'fix':c==='自由'?'free':'cond'}
function tagName(e){return (e.forced&&S.pending.includes(e.id))?'固定':e.cat}
function renderLists(){
  document.getElementById('pendingList').innerHTML=S.pending.length?S.pending.map(id=>{
    const e=EVENTS[id];
    return `<li><b>${e.title}</b><span class="tag ${tagCls(e.cat,e)}">${tagName(e)}</span>${id===current?.id?'<span style="color:#8c3b2e">·当前</span>':`<button class="doit" data-open="${id}">处理</button>`}</li>`;
  }).join(''):'<li style="color:#5c5443">（无）</li>';
  const av=availEvents();
  document.getElementById('availList').innerHTML=av.length?av.map(id=>{
    const e=EVENTS[id];
    return `<li><b>${e.title}</b><span class="tag ${tagCls(e.cat,e)}">${tagName(e)}</span><button class="doit" data-open="${id}">选择</button></li>`;
  }).join(''):'<li style="color:#5c5443">（本月已无可选事件）</li>';
  document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openEvent(b.dataset.open));
}

function availEvents(){
  if(S.over||S.pending.length>0)return [];   // 固定事件未办结前，不开放其他事件
  const ids=[];
  const free=['FREE-00','FREE-01','FREE-02','FREE-03'];
  const cond=['EH-0117-06','COND-01'];
  if(!S.usedFree&&S.ap>0)free.forEach(id=>{if(!S.pending.includes(id))ids.push(id)});
  if(!S.usedCond&&S.ap>0)cond.forEach(id=>{const e=EVENTS[id];if(e.check&&e.check(S)&&!S.pending.includes(id))ids.push(id)});
  if(S.ap>0&&S.rolls.eh07&&!S.doneProbs.includes('EH-0117-07'))ids.push('EH-0117-07');
  if(S.ap>0&&S.rolls.eh10&&!S.doneProbs.includes('EH-0117-10'))ids.push('EH-0117-10');
  return ids.filter(id=>!current||id!==current.id);
}

function openEvent(id){
  if(S.ap<=0&&!S.pending.includes(id))return;
  if(S.pending.length>0&&!S.pending.includes(id))return;  // 须先办结本月固定事件
  current=EVENTS[id];
  render();
  document.querySelector('.main').scrollIntoView({behavior:'smooth',block:'start'});
}

function renderEvent(){
  const e=current;
  const catName=(e.forced&&S.pending.includes(e.id))||e.cat==='固定'?'固定事件':e.cat==='自由'?'自由事件':e.cat==='条件'?'条件事件':'概率事件';
  document.getElementById('dossier').innerHTML=`
    <div class="ev-cat">${catName}</div>
    <div class="ev-title">${e.title}</div>
    <div class="ev-meta">${e.meta}</div>
    <div class="ev-text">「${e.text}」</div>
    <div class="choices">
      <div class="hint">请选择一项裁决${e.id==='EH-0117-12'?'（仅列出符合条件者）':''}：</div>
      ${e.options.map(o=>{
        const ok=o.condFn?o.condFn(S):true;
        const effTxt=[o.out].filter(Boolean).join('　');
        return `<button class="choice" data-opt="${o.k}" ${ok?'':'disabled'}>
          <span class="k">${o.k}</span>${o.label}${o.cond?` <span class="cond">〔${o.cond}〕</span>`:''}
          ${effTxt?`<span class="eff">${effTxt}</span>`:''}
        </button>`;
      }).join('')}
    </div>`;
  document.querySelectorAll('[data-opt]').forEach(b=>b.onclick=()=>choose(b.dataset.opt));
  document.getElementById('nav').innerHTML=`
    <button class="big ghost" id="skipEvent">稍后再议</button>
    ${(S.pending.length===0)?'<button class="big" id="nextMonth">转月 · 结算</button>':''}`;
  document.getElementById('skipEvent').onclick=()=>{current=null;render()};
  const nb=document.getElementById('nextMonth');if(nb)nb.onclick=nextMonth;
}

/* ============ 结算 ============ */
function applyEffects(str,zj){
  if(!str)return [];
  const re=/(民心|清议|圣眷|宦官|军心|朝望|理政|武略|文辞|健康|府库|兵备|私库|农民|政绩)\s*([+\-−＋－])\s*(\d+)/g;
  const out=[];let m;
  while((m=re.exec(str))){
    const n=m[1],d=(m[2]==='+'||m[2]==='＋'?1:-1)*parseInt(m[3]);
    if(SIXN.includes(n))S.six[n]=Math.max(0,S.six[n]+d);
    else if(TALN.includes(n))S.talents[n]=Math.max(0,S.talents[n]+d);
    else if(n==='流民')S.res[n]=Math.max(0,(S.res[n]||0)+d);
    else S.res[n]=(S.res[n]||0)+d;
    out.push(`${n}${d>=0?'+':''}${d}`);
  }
  if(zj!==undefined&&zj!==0)S.res['政绩']+=zj;
  return out;
}

function choose(k){
  const e=current,o=e.options.find(x=>x.k===k);
  if(!o||(o.condFn&&!o.condFn(S)))return;
  const isFree=e.cat==='自由',
        isProb=e.cat==='概率',
        isCond=e.cat==='条件';
  S.ap=Math.max(0,S.ap-1);   // 所有事件（含固定事件）均占用 1 行动点
  if(isFree)S.usedFree=true;
  if(isCond)S.usedCond=true;
  if(isProb)S.doneProbs.push(e.id);
  const delta=applyEffects(o.eff,o.zj);
  if(o.flag)S.flags[o.flag]=true;
  S.hits++;
  S.log.unshift(`第${S.month}月 ${e.title} · ${o.label}${delta.length?'（'+delta.join(' ')+'）':''}${o.out?' → '+o.out:''}`);
  const idx=S.pending.indexOf(e.id);if(idx>=0)S.pending.splice(idx,1);
  current=null;

  // 六维清零判定优先于一切剧情分支
  const dead=SIXN.find(n=>S.six[n]<=0);
  if(dead){gameOver(DIM_END[dead]);return;}
  if(o.end==='retire'){gameOver('e08');return;}
  if(o.end==='cityfall'){gameOver('e07');return;}
  if(e.id==='EH-0117-12'){gameOver('e09');return;}
  render();
}

function nextMonth(){
  if(S.pending.length>0){alert('尚有强制事件未处理，不可转月。');return;}
  const f=monthForecast();
  S.res['府库']=f.treasury;
  S.res['私库']=f.private;
  S.res['流民']=f.refugees;
  let note='';
  if(f.moraleDrop){S.six['民心']=Math.max(0,S.six['民心']-2);note=' · 流民≥2000，民心−2';}
  S.month++;
  S.ap=2;S.usedFree=false;S.usedCond=false;current=null;
  const add=id=>addFixed(id);
  if(S.month===2)add('EH-0117-03');
  if(S.month===3)add('EH-0117-04');
  if([4,16,28].includes(S.month))add('EH-0117-08');
  if(S.month===6)add('EH-0117-09');
  if([12,24,36].includes(S.month))add('EH-0117-11');
  if(S.month===36)add('EH-0117-12');
  rollMonth();
  S.log.unshift(`第${S.month}月 转月：府库 ${S.res['府库']}，私库 ${S.res['私库']}，流民 ${S.res['流民']}${note}`);
  const dead=SIXN.find(n=>S.six[n]<=0);
  if(dead){gameOver(DIM_END[dead]);return;}
  render();
}

function unlockEnding(id){
  try{
    const arr=JSON.parse(localStorage.getItem(ENDING_UNLOCK_KEY)||'[]');
    if(!arr.includes(id)){arr.push(id);localStorage.setItem(ENDING_UNLOCK_KEY,JSON.stringify(arr))}
  }catch(e){}
}
function unlockedEndings(){
  try{return JSON.parse(localStorage.getItem(ENDING_UNLOCK_KEY)||'[]')}catch(e){return []}
}
function endingColor(eid){return eid==='e09'?'#4a6b5d':eid==='e08'?'#a8843e':'#8c3b2e'}
function endingHead(end){
  return `<div class="ev-cat">终 局 · 结${String(end.num).padStart(2,'0')} · ${end.name}</div>
    <div class="endtitle" style="color:${endingColor(end.id)}">${end.name}</div>`;
}
function endingStats(){
  return `<div class="ev-meta">结局记录：民心 ${S.six['民心']} · 清议 ${S.six['清议']} · 圣眷 ${S.six['圣眷']} · 宦官 ${S.six['宦官']} · 军心 ${S.six['军心']} · 朝望 ${S.six['朝望']}<br>政绩 ${S.res['政绩']} · 府库 ${S.res['府库']} · 兵备 ${S.res['兵备']} · 私库 ${S.res['私库']} · 农民 ${S.res['农民']} · 流民 ${S.res['流民']}</div>`;
}
function renderEnding(){
  const end=ENDINGS[currentEnding];
  const dossier=document.getElementById('dossier');
  const nav=document.getElementById('nav');
  if(endingStage==='body'){
    dossier.className='dossier clickable';
    dossier.innerHTML=`${endingHead(end)}
      <div class="ev-meta">${end.meta}</div>
      <div class="endtext">${end.body.map(p=>`<div class="gbody">${p}</div>`).join('')}</div>
      <div class="ev-hint">点击此页或下方按钮，展读卷末语</div>
      ${endingStats()}`;
    dossier.onclick=()=>{endingStage='epi';render()};
    nav.innerHTML='<button class="big" id="showEpi">展读卷末语</button><button class="big ghost" id="seeEndings">结局图鉴</button>';
    document.getElementById('showEpi').onclick=()=>{endingStage='epi';render()};
  }else{
    dossier.innerHTML=`${endingHead(end)}
      <div class="epilogue"><h4>卷末语</h4>${end.epilogue.map(p=>`<p>${p}</p>`).join('')}</div>
      ${endingStats()}`;
    nav.innerHTML='<button class="big ghost" id="showBody">返回结局正文</button><button class="big" id="again">再来一世</button><button class="big ghost" id="seeEndings">结局图鉴</button>';
    document.getElementById('showBody').onclick=()=>{endingStage='body';render()};
    document.getElementById('again').onclick=()=>{S=fresh();mode='play';resetEndingView();rollMonth();render()};
  }
  document.getElementById('seeEndings').onclick=()=>document.getElementById('btnEndings').click();
}
function gameOver(eid){
  mode='over';S.over=true;S.ending=eid;current=null;
  currentEnding=eid;endingStage='body';
  unlockEnding(eid);
  render();
  renderLists();
}

/* ============ 弹窗 ============ */
function showModal(html){document.getElementById('modal').innerHTML=html;document.getElementById('mask').classList.add('on')}
function closeModal(){document.getElementById('mask').classList.remove('on')}
document.getElementById('mask').onclick=e=>{if(e.target.id==='mask')closeModal()};

document.getElementById('btnDossier').onclick=()=>showModal(`
  <h3>档案 · 李皋</h3><button class="close" onclick="closeModal()">×</button>
  <table><tr><th>项目</th><th>内容</th></tr>
  <tr><td>姓名</td><td>李皋，字尧臣</td></tr>
  <tr><td>籍贯</td><td>两浙路越州人</td></tr>
  <tr><td>出身</td><td>政和七年进士及第，首次中第；双亲早亡，无兄弟姐妹，由族中长老抚养</td></tr>
  <tr><td>官职</td><td>两浙路某县主簿（三年任期）</td></tr>
  <tr><td>标签</td><td>${Object.keys(S.flags).length?Object.keys(S.flags).join('、'):'（尚无）'}</td></tr>
  <tr><td>裁决次数</td><td>${S.hits}</td></tr></table>
  <h3 style="margin-top:16px">天赋</h3>
  <table><tr><th>天赋</th><th>数值</th></tr>${TALN.map(n=>`<tr><td>${n}</td><td>${S.talents[n]}</td></tr>`).join('')}</table>`);

document.getElementById('btnBag').onclick=()=>showModal(`
  <h3>行囊</h3><button class="close" onclick="closeModal()">×</button>
  <table><tr><th>物品</th><th>说明</th></tr>
  <tr><td>旧藤箱</td><td>母亲手抄《礼记》与数页药方</td></tr>
  <tr><td>私库银钱</td><td>现有 ${S.res['私库']} 文（每月 +30）</td></tr>
  <tr><td>官印</td><td>两浙路某县主簿印</td></tr></table>`);

document.getElementById('btnHelp').onclick=()=>showModal(`
  <h3>规则</h3><button class="close" onclick="closeModal()">×</button>
  <div style="font-size:16px;line-height:2">
  1. 每自然年分十二月，每月 2 行动点，当月有效、不累积；每任官 3 年（36 个月）。<br>
  2. 六维任一清零，立即进入对应失败结局；初始均为 60。<br>
  3. 转月结算：府库 ← 府库 − 兵备×1 + 农民×0.5；私库 ← 私库 + 30；流民 ← min(流民 + 150, 3000)。<br>
  4. 流民 ≥ 2000 时，每月民心固定 −2；自由事件、条件事件每月各至多触发一次。<br>
  5. 花石纲每年四月固定触发，全卷三次；贼寇略城每月 15% 概率命中；第 36 月秩满磨勘定去留。<br>
  6. 每月固定事件最多两项；满额时厢军暴动、贼寇略城命中本月不插入，次月按原条件重新判定。
  </div>`);

document.getElementById('btnEndings').onclick=()=>{
  const got=unlockedEndings();
  const cards=Object.values(ENDINGS).sort((a,b)=>a.num-b.num).map(end=>{
    if(!got.includes(end.id))return `<div class="locked">结${String(end.num).padStart(2,'0')} · 未解锁</div>`;
    return `<details>
      <summary>结${String(end.num).padStart(2,'0')} ${end.name} <span class="unlocked">〔已达成〕</span></summary>
      <div class="gmeta">${end.meta}</div>
      ${end.body.map(p=>`<div class="gbody">${p}</div>`).join('')}
      <div class="gepi"><h4 style="font-size:15px;color:var(--gold);margin:8px 0 4px">卷末语</h4>${end.epilogue.map(p=>`<p>${p}</p>`).join('')}</div>
    </details>`;
  }).join('');
  showModal(`<h3>结局图鉴 · 九种</h3><button class="close" onclick="closeModal()">×</button>
    <div class="gallery"><div style="font-size:14px;color:var(--ink2);margin-bottom:10px">已达成 ${got.length} / 9。未解锁结局不显示内容；点击已达成结局可展开正文与卷末语。</div>${cards}</div>`);
};

/* ============ 三个存档位 ============ */
const SLOT_KEYS=[1,2,3].map(i=>'xuanhe-save-'+i);
/* 一次性清除既有存档记录：仅清三个存档位，不触碰结局图鉴解锁记录 */
(function purgeOldSaves(){
  const FLAG='xuanhe-save-cleared-v1';
  try{
    if(!localStorage.getItem(FLAG)){
      SLOT_KEYS.forEach(k=>localStorage.removeItem(k));
      localStorage.setItem(FLAG,'1');
    }
  }catch(e){}
})();
function slotData(key){
  try{const d=localStorage.getItem(key);return d?JSON.parse(d):null}catch(e){return null}
}
function slotDesc(s){
  if(!s)return '（空）';
  const y=1117+Math.floor((s.month-1)/12),m=(s.month-1)%12+1;
  return `${ERA(y)}${MN[m-1]} · 第 ${s.month} 月 · 裁决 ${s.hits} 次`;
}
document.getElementById('btnSave').onclick=()=>{
  showModal(`<h3>存档 · 选择保存位</h3><button class="close" onclick="closeModal()">×</button>
  <div style="font-size:16px;line-height:2;margin-bottom:12px">选择存档位，保存当前进度：</div>
  <table><tr><th>存档位</th><th>现有记录</th><th>操作</th></tr>
  ${SLOT_KEYS.map((k,i)=>{const s=slotData(k);return `<tr><td>存档位 ${i+1}</td><td>${slotDesc(s)}</td><td><button class="tbtn" data-save="${k}">${s?'覆盖':'保存'}</button></td></tr>`}).join('')}
  </table>`);
  document.querySelectorAll('[data-save]').forEach(b=>b.onclick=()=>{
    try{localStorage.setItem(b.dataset.save,JSON.stringify(S));closeModal();S.log.unshift('（已存档）');render();alert('已保存到存档位 '+b.dataset.save.slice(-1))}catch(e){alert('存档失败：'+e.message)}
  });
};
document.getElementById('btnLoad').onclick=()=>{
  showModal(`<h3>读档 · 选择存档位</h3><button class="close" onclick="closeModal()">×</button>
  <div style="font-size:16px;line-height:2;margin-bottom:12px">选择存档位，读取进度：</div>
  <table><tr><th>存档位</th><th>现有记录</th><th>操作</th></tr>
  ${SLOT_KEYS.map((k,i)=>{const s=slotData(k);return `<tr><td>存档位 ${i+1}</td><td>${slotDesc(s)}</td><td><button class="tbtn" data-load="${k}" ${s?'':'disabled'}>读取</button></td></tr>`}).join('')}
  </table>`);
  document.querySelectorAll('[data-load]').forEach(b=>b.onclick=()=>{
    if(b.disabled)return;
    try{const d=localStorage.getItem(b.dataset.load);if(!d){alert('该存档位为空');return}S=JSON.parse(d);mode=S.over?'over':'play';current=null;closeModal();if(S.over&&S.ending){gameOver(S.ending)}else{resetEndingView();render()}alert('已读取存档位 '+b.dataset.load.slice(-1))}catch(e){alert('读档失败：'+e.message)}
  });
};
document.getElementById('btnRestart').onclick=()=>{
  if(confirm('确定重新开始？当前进度将遗失。')){S=fresh();mode='play';resetEndingView();rollMonth();render()}
};

/* ============ 启动 ============ */
S=fresh();rollMonth();render();
</script>
</body>
